# Local Postgres for the backend (matches database_url in backend/app/config.py).
# Start: docker compose up -d    Stop: docker compose down    (data survives in the pgdata volume)
services:
  db:
    image: postgres:17
    container_name: videostudio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: prep
      POSTGRES_PASSWORD: prep
      POSTGRES_DB: videostudio
    ports:
      - "5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prep -d videostudio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
